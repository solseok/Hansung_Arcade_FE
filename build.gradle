plugins {
    id 'application'
}

group = 'hansung.arcade'
version = '0.1.0'

java {
    // 팀 공통 JDK. IntelliJ·Eclipse 모두 이 값을 읽어 같은 버전으로 컴파일한다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 로깅: 코드에서는 SLF4J API로 로그를 남기고, 실제 출력은 Logback이 맡는다 (설정: resources/logback.xml)
    // Logback은 HSU 색상 컨버터(core.log)가 직접 쓰므로 implementation
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'ch.qos.logback:logback-classic:1.5.38'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainClass = 'hansung.arcade.HansungArcadeApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ./gradlew run 에서 Scanner(System.in) 입력을 받을 수 있게 연결
tasks.named('run') {
    standardInput = System.in
}
