# 게임 실행 설정. 실행 인자로 덮어쓸 수 있다.
# 예) ./gradlew run --args="--game.start-map=camp/camp08"

app.title=Hansung Arcade

# 첫 화면. login(기본): 목업 로그인 → 로비 → 대기실 → 게임 → 결과 / lobby: 로비부터 / game: 인게임을 바로 띄운다
# 아래 game.start-map, player.*, player2.*, game.local-players, game.test-items 는 game 으로 바로 띄울 때 쓴다
app.start-screen=login

# 인게임을 바로 띄울 때(app.start-screen=game)의 맵 (resources/maps/{id}.txt)
game.start-map=village/village10

# 경기 방식 (한 판 3분)
# solo: 개인전. 마지막까지 살아남은 한 명만 승리, 시간이 다 될 때 2명 이상 살아 있으면 모두 무승부
# team: 팀전. 마지막까지 살아남은 팀이 승리, 시간이 다 될 때 2팀 이상 살아 있으면 모두 무승부
game.match-mode=solo

# 인게임을 바로 띄울 때 쓸 내 닉네임과 캐릭터 (아웃게임에서는 로그인·대기실에서 고른 값을 쓴다)
# 캐릭터: sangsangbugi, kkukku, kkokko, sangzzi, hansungnyangi
player.nickname=Player
player.character=sangsangbugi
# 팀전에서 내 팀 번호 (1부터). 개인전에서는 쓰지 않는다
player.team=1
# 캐릭터 고정색(남색 후드, 빨간 가방처럼 캐릭터마다 정해진 부분)을 칠할 색. 비워 두면 원래 그림 색
# 색: red, yellow, orange, green, sky, blue, purple, magenta
player.color=

# 인게임을 바로 띄울 때 한 키보드로 함께 할 인원 (아웃게임에서는 로그인에서 고른 1P·2P를 쓴다)
# 1: 혼자. 방향키 이동, Space 물풍선, Shift 아이템
# 2: 한 키보드 2인. 1P는 W/A/S/D 이동, Space 물풍선, 왼쪽 Shift 아이템
#                  2P는 방향키 이동, / 물풍선, 아이템은 macOS면 오른쪽 Option,
#                  Windows 등은 오른쪽 Ctrl (오른쪽 Ctrl이 없는 키보드는 오른쪽 Alt·AltGr)
#                  2P 아이템은 어디서나 . (마침표, / 왼쪽 키)로도 쓸 수 있다.
#                  한국어 Windows 키보드처럼 오른쪽 Alt·Ctrl이 한/영·한자 키인 경우에 쓴다
# 예) ./gradlew run --args="--app.start-screen=game --game.local-players=2"
game.local-players=1

# 2인 모드에서 2P의 닉네임·캐릭터·팀·고정색 (1P는 위의 player.* 설정)
player2.nickname=Player2
player2.character=hansungnyangi
# 팀전에서 2P의 팀 번호 (1부터, 기본 2팀). 개인전에서는 쓰지 않는다
player2.team=2
# 2P의 캐릭터 고정색. 비워 두면 원래 그림 색
player2.color=

# 아이템 시험 모드. true면 시작할 때 1P 스폰 둘레 빈 칸에 아이템 11종을 한 개씩 깔아 둔다
# (블럭·비행기가 떨어뜨리지 않는 장갑·신발·스프링 신발·보호막·바늘·탱크·빨간 악마·울트라도 시험해 볼 수 있다)
# 예) ./gradlew run --args="--app.start-screen=game --game.test-items=true"
game.test-items=false

# offline: 서버 없이 혼자 실행 (로비·대기실 목업) / online: 로그인할 때 서버에 접속해 로그인·로비·대기실을 서버로 한다
# 예) ./gradlew run --args="--network.mode=online"
network.mode=offline
# 서버 주소·포트는 커밋하지 않는 .env(프로젝트 폴더)나 환경 변수의 SERVER_HOST·SERVER_PORT로 채운다 (.env.example 참고)
# ${이름}은 환경 변수, 없으면 .env 값으로 바뀐다. 실행 인자 --network.host=... 가 있으면 그 값을 쓴다
network.host=${SERVER_HOST}
network.port=${SERVER_PORT}
