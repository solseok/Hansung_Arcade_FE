# 게임 실행 설정. 실행 인자로 덮어쓸 수 있다.
# 예) ./gradlew run --args="--game.start-map=camp/camp08"

app.title=Hansung Arcade

# 아웃게임과 연결되기 전까지 바로 띄울 인게임 맵 (resources/maps/{id}.txt)
game.start-map=village/village10

# 아웃게임과 연결되기 전까지 쓸 내 닉네임과 캐릭터
# 캐릭터: sangsangbugi, kkukku, kkokko, sangzzi, hansungnyangi
player.nickname=Player
player.character=sangsangbugi

# offline: 서버 없이 혼자 실행 / online: 서버 접속 (아직 미구현)
network.mode=offline
network.host=localhost
network.port=9000
